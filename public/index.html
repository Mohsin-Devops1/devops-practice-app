<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevOps Practice App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    .meta { color: #666; font-size: 14px; margin-bottom: 24px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; font-size: 16px; }
    button { padding: 8px 14px; font-size: 14px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
    li span { flex: 1; cursor: pointer; }
    li.done span { text-decoration: line-through; color: #999; }
  </style>
</head>
<body>
  <h1>DevOps Practice App</h1>
  <div class="meta" id="meta">Loading version...</div>

  <form id="form">
    <input id="title" placeholder="Add a task..." autocomplete="off" />
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>

  <script>
    async function loadInfo() {
      const info = await (await fetch("/api/info")).json();
      document.getElementById("meta").textContent =
        `v${info.version} | env: ${info.environment} | host: ${info.hostname}`;
    }

    async function loadTodos() {
      const todos = await (await fetch("/api/todos")).json();
      const list = document.getElementById("list");
      list.innerHTML = "";
      todos.forEach((t) => {
        const li = document.createElement("li");
        if (t.done) li.className = "done";
        const span = document.createElement("span");
        span.textContent = t.title;
        span.onclick = async () => { await fetch(`/api/todos/${t.id}/toggle`, { method: "PATCH" }); loadTodos(); };
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = async () => { await fetch(`/api/todos/${t.id}`, { method: "DELETE" }); loadTodos(); };
        li.append(span, del);
        list.appendChild(li);
      });
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("title");
      if (!input.value.trim()) return;
      await fetch("/api/todos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: input.value }),
      });
      input.value = "";
      loadTodos();
    });

    loadInfo();
    loadTodos();
  </script>
</body>
</html>
